<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EFE6">
<meta name="robots" content="noindex">
<title>Bar Vitali — Menu</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}})();document.documentElement.classList.add('js')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
body{min-height:100vh;min-height:100dvh}
.pick{padding-top:var(--gap);padding-bottom:32px;display:flex;flex-direction:column;gap:var(--gap)}
.pick-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:clamp(28px,5vw,52px) 24px}
.pick-hero .eyebrow{color:var(--sun);letter-spacing:.04em}
.hello{font-weight:800;font-size:clamp(2.6rem,9vw,5rem);line-height:1;letter-spacing:-.04em;min-height:1.1em;display:block}
.hello span{display:inline-block;animation:helloin .6s cubic-bezier(.2,.8,.2,1) both}
.pick-hero .ask{font-size:clamp(1rem,2.4vw,1.2rem);line-height:1.5;color:var(--cream);max-width:560px}
.pick-hero .ask b{display:block;font-weight:600}
.langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.lc{display:flex;align-items:center;justify-content:space-between;gap:16px;text-decoration:none;color:#2E211B;border-radius:var(--r);padding:clamp(22px,3vw,34px);min-height:150px;position:relative;overflow:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;animation:lcin .7s cubic-bezier(.2,.8,.2,1) backwards}
.lc:nth-child(1){animation-delay:.25s}.lc:nth-child(2){animation-delay:.35s}.lc:nth-child(3){animation-delay:.45s}.lc:nth-child(4){animation-delay:.55s}
.lc:hover,.lc:focus-visible{transform:translateY(-6px) rotate(-.8deg);box-shadow:0 16px 34px rgba(46,33,27,.22);color:#2E211B}
.lc:active{transform:scale(.97)}
.lc .code{font-weight:800;font-size:clamp(3rem,9vw,4.6rem);line-height:.9;letter-spacing:-.05em}
.lc .name{display:block;font-weight:800;font-size:clamp(1.3rem,3vw,1.7rem);letter-spacing:-.02em}
.lc .sub{display:block;font-size:15px;font-weight:600;margin-top:4px;opacity:.8}
.lc .go{flex:none;width:46px;height:46px;border-radius:50%;background:rgba(46,33,27,.12);display:flex;align-items:center;justify-content:center;transition:transform .3s,background .3s}
.lc:hover .go{transform:translateX(6px);background:rgba(46,33,27,.2)}
.lc .go svg{width:22px;height:22px}
.lc.it{background:var(--sun)}.lc.en{background:var(--sage)}.lc.de{background:var(--terra);color:#fff}.lc.fr{background:#F6EFE6}
.lc.de:hover,.lc.de:focus-visible{color:#fff}.lc.de .go{background:rgba(255,255,255,.2)}
.menu-skip{text-align:center;font-size:14px;color:var(--mut)}
@keyframes helloin{from{opacity:0;transform:translateY(28px) rotate(3deg)}to{opacity:1;transform:none}}
@keyframes lcin{from{opacity:0;transform:translateY(34px) scale(.95)}to{opacity:1;transform:none}}
@media (max-width:760px){
.langs{grid-template-columns:1fr}
.lc{min-height:0;padding:14px 18px;border-radius:24px}
.lc>span:first-child{display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:center}
.lc .code{font-size:2.6rem;grid-row:1/3;min-width:2.9ch}
.lc .name{font-size:1.25rem}.lc .sub{font-size:14px;margin-top:0}
.lc .go{width:40px;height:40px}
.hello{font-size:2.4rem}
.pick-hero{gap:10px}
body{padding-bottom:0}
.pick-hero{padding:26px 18px}
}
</style>
</head>
<body>

<header>
<div class="wrap">
<nav class="nav" aria-label="Bar Vitali">
<a class="logo" href="/" aria-label="Bar Vitali"><span class="lw b">Bar</span> <span class="lw v">Vitali</span><span class="lw dt">.</span></a>
<div class="actions"><button class="theme" type="button" aria-pressed="false" aria-label="Tema scuro"><svg class="moonico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sunico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
</nav>
</div>
</header>

<main class="wrap pick" data-no-i18n>
<section class="card dark pick-hero" aria-labelledby="hello">
<p class="eyebrow">Piazza della Vittoria 7 · Acquate, Lecco</p>
<h1 class="hello" id="hello" aria-live="off"><span>Benvenuti</span></h1>
<p class="ask"><b>Scegli la lingua del menu</b>Choose your language · Sprache wählen · Choisissez la langue</p>
</section>

<nav class="langs" aria-label="Lingua / Language">
<a class="lc it" href="/menu.html?lang=it" hreflang="it" lang="it"><span><span class="code">IT</span><span class="name">Italiano</span><span class="sub">Menu in italiano</span></span><span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
<a class="lc en" href="/menu.html?lang=en" hreflang="en" lang="en"><span><span class="code">EN</span><span class="name">English</span><span class="sub">Menu in English</span></span><span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
<a class="lc de" href="/menu.html?lang=de" hreflang="de" lang="de"><span><span class="code">DE</span><span class="name">Deutsch</span><span class="sub">Speisekarte auf Deutsch</span></span><span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
<a class="lc fr" href="/menu.html?lang=fr" hreflang="fr" lang="fr"><span><span class="code">FR</span><span class="name">Français</span><span class="sub">Menu en français</span></span><span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
</nav>
</main>

<script>
(function () {
  // saluto che cambia lingua
  var words = ['Benvenuti', 'Welcome', 'Willkommen', 'Bienvenue'];
  var el = document.getElementById('hello');
  var i = 0;
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setInterval(function () {
      i = (i + 1) % words.length;
      el.innerHTML = '<span></span>';
      el.firstChild.textContent = words[i];
    }, 2200);
  }
  // pulsante tema
  var btn = document.querySelector('.theme');
  function sync() {
    var dark = document.documentElement.dataset.theme === 'dark';
    btn.setAttribute('aria-pressed', dark);
    btn.setAttribute('aria-label', dark ? 'Tema chiaro / Light theme' : 'Tema scuro / Dark theme');
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', dark ? '#1B1310' : '#F6EFE6');
  }
  btn.addEventListener('click', function () {
    var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
    sync();
  });
  sync();
})();
</script>
</body>
</html>
